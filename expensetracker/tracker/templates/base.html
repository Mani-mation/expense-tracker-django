<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --md-primary: #3A5A40;
            --md-primary-light: #DCE8DC;
            --md-secondary: #B08968;
            --md-surface: #FBFBF5;
            --md-surface-card: #FFFFFF;
            --md-on-surface: #1A1C18;
            --md-on-surface-muted: #5C6058;
            --md-outline: #E3E4DA;
            --md-error: #BA1A1A;
            --radius-lg: 28px;
            --radius-md: 16px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--md-surface);
            color: var(--md-on-surface);
        }

        h1, h2, h3, .display {
            font-family: 'Manrope', sans-serif;
            font-weight: 800;
            margin: 0;
        }

        .topbar {
            background: var(--md-primary);
            color: white;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        .topbar .brand {
            font-family: 'Manrope', sans-serif;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.02em;
        }

        .topbar .user-chip {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 100px;
            padding: 10px 22px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            background: var(--md-secondary);
            color: white;
        }

        .btn-ghost {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        .card {
            background: var(--md-surface-card);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: 0 1px 3px rgba(26,28,24,0.06), 0 8px 24px rgba(26,28,24,0.04);
            margin-bottom: 24px;
        }

        input, select {
            font-family: 'Inter', sans-serif;
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--md-outline);
            border-radius: var(--radius-md);
            font-size: 15px;
            margin-top: 6px;
            margin-bottom: 18px;
            background: var(--md-surface);
            color: var(--md-on-surface);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--md-primary);
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--md-on-surface-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 8px; font-size: 14px; }
        th {
            color: var(--md-on-surface-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1.5px solid var(--md-outline);
        }
        td { border-bottom: 1px solid var(--md-outline); }

        .pill {
            display: inline-block;
            background: var(--md-primary-light);
            color: var(--md-primary);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--md-on-surface-muted);
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
